name: Check Android emulator acceleration for Rato

on:
  push:
    branches:
      - codex/android-kvm-probe-rato

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'TonyRod116/rato-al-sol' && github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check emulator and grant this ephemeral runner access to KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chown "root:$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM_READ_WRITE=yes"
            else
              echo "KVM_READ_WRITE=no"
            fi
          else
            echo "KVM_AVAILABLE=no"
          fi
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/emulator/emulator" ]; then
            echo "ANDROID_EMULATOR=available"
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            if [ -d "$ANDROID_HOME/system-images" ]; then
              find "$ANDROID_HOME/system-images" -name source.properties -print
            else
              echo "SYSTEM_IMAGES=none"
            fi
          else
            echo "ANDROID_EMULATOR=not_installed"
          fi
