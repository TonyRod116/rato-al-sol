name: Android local preview

on:
  push:
    branches:
      - codex/android-local-preview

permissions:
  contents: read

concurrency:
  group: rato-android-local-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'TonyRod116/rato-al-sol' && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the private project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check Android tools and install the EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -n "${JAVA_HOME_17_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          npm install --global eas-cli@27.4.0

      - name: Install project dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Build an Android preview using Rato credentials
        working-directory: mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          eas env:exec preview 'test -n "${RATO_ANDROID_MAPS_API_KEY:-}" && printf "::add-mask::%s\n" "$RATO_ANDROID_MAPS_API_KEY" && eas build --platform android --profile preview --local --non-interactive --freeze-credentials --output "$RUNNER_TEMP/rato-android-preview.apk"' --non-interactive
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/rato-android-preview.apk" |
            grep -Fqi 'Signer #1 certificate SHA-1 digest: 957b2f3f1d7d2a90c0d42396b8d11ac2a8a54f11'

      - name: Store the signed APK as a private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rato-android-preview
          path: ${{ runner.temp }}/rato-android-preview.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
