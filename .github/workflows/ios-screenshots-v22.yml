name: Rato iOS screenshot candidate (draft)

on:
  push:
    branches:
      - codex/ios-screenshots-v22

permissions:
  contents: read

jobs:
  screenshots:
    if: github.repository == 'TonyRod116/rato-al-sol' && github.event.repository.private
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Build a release-mode simulator app without store credentials
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo run:ios --configuration Release --device generic --output "$RUNNER_TEMP/rato-simulator"
          bundle_path="$(find "$RUNNER_TEMP/rato-simulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$bundle_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$bundle_path/Info.plist")" = 'com.ratoalsol.app'
      - name: Capture native screens for manual review
        shell: bash
        run: |
          set -euo pipefail
          bundle_path="$(find "$RUNNER_TEMP/rato-simulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/rato-screen-candidates"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/rato-simulator-devices.json"
          for spec in 'iPhone 17 Pro|iphone' 'iPad Pro 13-inch (M5)|ipad'; do
            device_name="${spec%|*}"
            device_label="${spec##*|}"
            device_id="$(python3 .github/scripts/choose_rato_simulator.py "$RUNNER_TEMP/rato-simulator-devices.json" "$device_name")"
            xcrun simctl boot "$device_id"
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl ui "$device_id" appearance light
            xcrun simctl status_bar "$device_id" override --time '9:41' --dataNetwork wifi --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl install "$device_id" "$bundle_path"
            SIMCTL_CHILD_TZ=Europe/Madrid xcrun simctl launch "$device_id" com.ratoalsol.app
            sleep 25
            xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/rato-screen-candidates/${device_label}-25s.png"
            sleep 20
            xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/rato-screen-candidates/${device_label}-45s.png"
            xcrun simctl shutdown "$device_id"
          done
          python3 .github/scripts/check_rato_screenshot_dimensions.py "$RUNNER_TEMP/rato-screen-candidates"
      - name: Save screenshots for human inspection (do not publish automatically)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rato-ios-screenshot-candidates
          path: ${{ runner.temp }}/rato-screen-candidates/*.png
          if-no-files-found: warn
          retention-days: 1
