name: Android 23 production and preview builds

on:
  push:
    branches:
      - codex/rato-unified-release-23-24

permissions:
  contents: read

concurrency:
  group: rato-android-production-draft
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'TonyRod116/rato-al-sol' && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the private project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check Android tools and install the EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -n "${JAVA_HOME_17_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          npm install --global eas-cli@27.4.0

      - name: Install project dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Check release identifiers and build profiles
        working-directory: mobile
        run: |
          node -e 'const c=require("./app.json").expo, e=require("./eas.json"); if(c.android.package!=="com.ratoalsol.app" || c.android.versionCode!==23 || String(c.ios.buildNumber)!=="24" || e.cli.appVersionSource!=="local" || e.build.preview.android.buildType!=="apk" || e.build.preview.distribution!=="internal") process.exit(1)'

      - name: Build an Android App Bundle with existing credentials
        working-directory: mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          eas env:exec production 'test -n "${RATO_ANDROID_MAPS_API_KEY:-}" && printf "::add-mask::%s\n" "$RATO_ANDROID_MAPS_API_KEY" && eas build --platform android --profile production --local --non-interactive --freeze-credentials --output "$RUNNER_TEMP/rato-android-production.aab"' --non-interactive

      - name: Verify the Android bundle and upload certificate
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          bundle="$RUNNER_TEMP/rato-android-production.aab"
          verification_dir="$(mktemp -d "$RUNNER_TEMP/rato-verify.XXXXXX")"
          trap 'rm -rf "$verification_dir"' EXIT
          jarsigner -verify "$bundle" > "$verification_dir/signature.txt" 2>&1
          grep -Fq 'jar verified.' "$verification_dir/signature.txt"
          if grep -Fiq 'unsigned entries' "$verification_dir/signature.txt"; then
            echo 'Bundle contains unsigned entries' >&2
            exit 1
          fi
          keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$bundle" > "$verification_dir/certificate.txt"
          sha1="$(sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' "$verification_dir/certificate.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$sha1" = '957b2f3f1d7d2a90c0d42396b8d11ac2a8a54f11'
          echo 'Upload certificate matches the existing Rato test signing certificate.'
          # Google bundletool, pinned to the public release's SHA-256.
          bundletool="$verification_dir/bundletool.jar"
          curl --fail --location --silent --show-error --retry 2 \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output "$bundletool"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$bundletool" | sha256sum --check --status
          # The decoded manifest can contain the Maps key. Never print or upload it.
          java -jar "$bundletool" dump manifest --bundle="$bundle" > "$verification_dir/manifest.xml"
          python3 .github/scripts/verify_android_manifest.py "$verification_dir/manifest.xml" mobile/app.json

      - name: Store the signed bundle as a private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rato-android-production
          path: ${{ runner.temp }}/rato-android-production.aab
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Build an Android test APK with the same existing credentials
        working-directory: mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          eas env:exec production 'test -n "${RATO_ANDROID_MAPS_API_KEY:-}" && printf "::add-mask::%s\n" "$RATO_ANDROID_MAPS_API_KEY" && eas build --platform android --profile preview --local --non-interactive --freeze-credentials --output "$RUNNER_TEMP/rato-android-preview.apk"' --non-interactive

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/rato-android-preview.apk"
          verification_dir="$(mktemp -d "$RUNNER_TEMP/rato-apk-verify.XXXXXX")"
          trap 'rm -rf "$verification_dir"' EXIT
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apksigner"
          test -x "$analyzer"
          "$apksigner" verify --verbose --print-certs "$apk" > "$verification_dir/signature.txt"
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$verification_dir/signature.txt")" -eq 1
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$verification_dir/signature.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$digest" = '347878355437a1cc16cd04a47abec2748341682dddca8224f684ab29ef01e895'
          "$analyzer" manifest print "$apk" > "$verification_dir/manifest.xml"
          python3 .github/scripts/verify_android_manifest.py "$verification_dir/manifest.xml" mobile/app.json
          echo 'APK signature matches the existing Rato test signing certificate.'

      - name: Store the signed test APK as a separate private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rato-android-preview-v23
          path: ${{ runner.temp }}/rato-android-preview.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
